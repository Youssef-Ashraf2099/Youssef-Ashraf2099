<svg xmlns="http://www.w3.org/2000/svg" width="860" height="332" viewBox="0 0 860 332" role="img" aria-label="Youssef Ashraf - Midnight Computer Nerd Lab">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060A17"/>
      <stop offset="55%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#17223B"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A101E"/>
      <stop offset="100%" stop-color="#111A2E"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.34"/>
      <stop offset="45%" stop-color="#F59E0B" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#00F7F7" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#00F7F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="35%" stop-color="#38BDF8"/>
      <stop offset="70%" stop-color="#00F7F7"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="rgbKb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="33%" stop-color="#00F7F7"/>
      <stop offset="66%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="buildProg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#00F7F7"/>
    </linearGradient>
    <clipPath id="winClip">
      <rect x="24" y="22" width="270" height="184" rx="14"/>
    </clipPath>
    <clipPath id="screenClip">
      <rect x="82" y="106" width="154" height="96" rx="6"/>
    </clipPath>
    <clipPath id="codeClip">
      <rect x="86" y="122" width="76" height="62"/>
    </clipPath>
  </defs>

  <style>
    @keyframes twinkle {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 1; }
    }
    @keyframes shootingStar {
      0%, 72% { transform: translate(0px, 0px); opacity: 0; }
      76% { opacity: 0.95; }
      88% { transform: translate(90px, 34px); opacity: 0; }
      100% { transform: translate(90px, 34px); opacity: 0; }
    }
    @keyframes steam1 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0; }
      25% { opacity: 0.7; }
      75% { opacity: 0.35; }
      100% { transform: translateY(-22px) translateX(4px); opacity: 0; }
    }
    @keyframes steam2 {
      0% { transform: translateY(0px) translateX(0px); opacity: 0; }
      30% { opacity: 0.6; }
      100% { transform: translateY(-24px) translateX(-4px); opacity: 0; }
    }
    @keyframes cursorBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes eqBar {
      0%, 100% { transform: scaleY(0.32); }
      50% { transform: scaleY(1); }
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.15; }
      50% { opacity: 0.5; }
      100% { transform: translateY(88px); opacity: 0.08; }
    }
    @keyframes codeScroll {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-36px); }
    }
    @keyframes progressSweep {
      0% { transform: scaleX(0.18); }
      50% { transform: scaleX(0.95); }
      85% { transform: scaleX(1); }
      100% { transform: scaleX(0.18); }
    }
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes fanSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes ledBlink {
      0%, 35%, 100% { opacity: 0.25; }
      15%, 65% { opacity: 1; }
    }
    @keyframes rgbBreath {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }
    @keyframes waveSlide {
      0% { transform: translateX(0px); }
      100% { transform: translateX(-28px); }
    }
    @keyframes onlinePulse {
      0%, 100% { opacity: 0.55; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.18); }
    }
    @keyframes nodePing {
      0%, 100% { opacity: 0.45; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    .star1 { animation: twinkle 3.1s ease-in-out infinite; }
    .star2 { animation: twinkle 4.2s ease-in-out infinite 1.1s; }
    .star3 { animation: twinkle 3.7s ease-in-out infinite 2.0s; }
    .shoot { animation: shootingStar 7.5s ease-out infinite; }
    .st1 { animation: steam1 3.4s ease-out infinite; }
    .st2 { animation: steam2 3.8s ease-out infinite 1.2s; }
    .st3 { animation: steam1 4.1s ease-out infinite 2.1s; }
    .cur { animation: cursorBlink 1.05s step-end infinite; }
    .eq1 { transform-box: fill-box; transform-origin: bottom; animation: eqBar 1.1s ease-in-out infinite; }
    .eq2 { transform-box: fill-box; transform-origin: bottom; animation: eqBar 0.85s ease-in-out infinite 0.2s; }
    .eq3 { transform-box: fill-box; transform-origin: bottom; animation: eqBar 1.3s ease-in-out infinite 0.4s; }
    .eq4 { transform-box: fill-box; transform-origin: bottom; animation: eqBar 0.95s ease-in-out infinite 0.1s; }
    .eq5 { transform-box: fill-box; transform-origin: bottom; animation: eqBar 1.2s ease-in-out infinite 0.35s; }
    .scanline { animation: scan 3.4s linear infinite; }
    .codeStream { animation: codeScroll 5.2s linear infinite; }
    .progFill { transform-box: fill-box; transform-origin: left; animation: progressSweep 4.8s ease-in-out infinite; }
    .radarSweep { transform-box: fill-box; transform-origin: center; animation: radarSpin 3.2s linear infinite; }
    .pcFan { transform-box: fill-box; transform-origin: center; animation: fanSpin 1.8s linear infinite; }
    .hddLed { animation: ledBlink 1.1s steps(2, end) infinite; }
    .netLed { animation: ledBlink 1.7s steps(2, end) infinite 0.4s; }
    .kbGlow { animation: rgbBreath 2.8s ease-in-out infinite; }
    .sparkSlide { animation: waveSlide 2.6s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: onlinePulse 2.3s ease-in-out infinite; }
    .nping { transform-box: fill-box; transform-origin: center; animation: nodePing 2.2s ease-in-out infinite; }
    .nping2 { transform-box: fill-box; transform-origin: center; animation: nodePing 2.2s ease-in-out infinite 0.8s; }
  </style>

  <!-- Outer Frame -->
  <rect x="1" y="1" width="858" height="330" rx="18" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="28" y="1" width="804" height="3" rx="1.5" fill="url(#accentGrad)"/>

  <!-- LEFT SCENE: Computer Nerd Late-Night Rig -->
  <g>
    <!-- Night Window -->
    <rect x="24" y="22" width="270" height="184" rx="14" fill="url(#skyGrad)" stroke="#24324D" stroke-width="1.5"/>
    <g clip-path="url(#winClip)">
      <circle class="star1" cx="56" cy="46" r="1.4" fill="#FDE68A"/>
      <circle class="star2" cx="95" cy="62" r="1.1" fill="#E2E8F0"/>
      <circle class="star3" cx="148" cy="40" r="1.6" fill="#BAE6FD"/>
      <circle class="star1" cx="204" cy="54" r="1.2" fill="#FDE68A"/>
      <circle class="star2" cx="255" cy="44" r="1.3" fill="#E2E8F0"/>
      <circle class="star3" cx="72" cy="94" r="1" fill="#94A3B8"/>
      <circle class="star1" cx="235" cy="88" r="1.4" fill="#BAE6FD"/>
      <!-- Shooting Star -->
      <g class="shoot">
        <line x1="66" y1="36" x2="86" y2="44" stroke="#BAE6FD" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="86" cy="44" r="1.8" fill="#FFFFFF"/>
      </g>
      <!-- Crescent Moon -->
      <circle cx="246" cy="56" r="14" fill="#FDE68A" opacity="0.92"/>
      <circle cx="252" cy="52" r="12" fill="#0B1224"/>
      <!-- Skyline -->
      <path d="M24 206 L24 160 L46 160 L46 142 L66 142 L66 168 L82 168 L82 136 L106 136 L106 162 L128 162 L128 148 L152 148 L152 170 L180 170 L180 132 L206 132 L206 159 L234 159 L234 144 L260 144 L260 166 L294 166 L294 206 Z" fill="#0A1223" opacity="0.92"/>
      <rect x="52" y="150" width="3" height="4" fill="#F59E0B" opacity="0.75"/>
      <rect x="90" y="144" width="3" height="4" fill="#F59E0B" opacity="0.6"/>
      <rect x="96" y="152" width="3" height="4" fill="#38BDF8" opacity="0.6"/>
      <rect x="188" y="140" width="3" height="4" fill="#F59E0B" opacity="0.75"/>
      <rect x="242" y="152" width="3" height="4" fill="#38BDF8" opacity="0.55"/>
      <!-- Window Crossbars -->
      <line x1="159" y1="22" x2="159" y2="206" stroke="#1E293B" stroke-width="2" opacity="0.5"/>
      <line x1="24" y1="114" x2="294" y2="114" stroke="#1E293B" stroke-width="2" opacity="0.5"/>
    </g>

    <!-- Warm Desk Lamp -->
    <ellipse cx="62" cy="192" rx="74" ry="70" fill="url(#lampGlow)"/>
    <path d="M36 260 L44 172 L62 150" fill="none" stroke="#334155" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M51 150 L75 150 L82 163 L45 163 Z" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
    <ellipse cx="63.5" cy="163" rx="13" ry="3.2" fill="#FBBF24" opacity="0.92"/>

    <!-- Desk Surface -->
    <rect x="22" y="260" width="274" height="12" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect x="22" y="272" width="274" height="34" rx="5" fill="#090E1A"/>

    <!-- Mini Homelab / PC Tower on Left of Desk -->
    <g transform="translate(30, 200)">
      <rect x="0" y="0" width="36" height="60" rx="5" fill="#0F172A" stroke="#334155" stroke-width="1.3"/>
      <!-- Glass Fan Window -->
      <rect x="5" y="7" width="26" height="26" rx="4" fill="#070C17" stroke="#1E293B"/>
      <g class="pcFan" transform="translate(18, 20)">
        <circle cx="0" cy="0" r="9.5" fill="none" stroke="#00F7F7" stroke-width="1" opacity="0.45"/>
        <path d="M0 -8 L2.5 -2 L8 0 L2.5 2 L0 8 L-2.5 2 L-8 0 L-2.5 -2 Z" fill="#38BDF8" opacity="0.8"/>
        <circle cx="0" cy="0" r="2.2" fill="#F59E0B"/>
      </g>
      <!-- Drive / Network LEDs -->
      <circle class="hddLed" cx="10" cy="44" r="2" fill="#F59E0B"/>
      <circle class="netLed" cx="18" cy="44" r="2" fill="#34D399"/>
      <circle cx="26" cy="44" r="2" fill="#38BDF8" opacity="0.7"/>
      <rect x="8" y="51" width="20" height="3" rx="1.5" fill="#1E293B"/>
    </g>

    <!-- Ultrawide Nerd Monitor -->
    <ellipse cx="159" cy="154" rx="98" ry="64" fill="url(#screenGlow)"/>
    <rect x="76" y="100" width="166" height="108" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
    <rect x="82" y="106" width="154" height="96" rx="6" fill="#060C18"/>

    <!-- Multi-Pane Animated Monitor OS -->
    <g clip-path="url(#screenClip)">
      <!-- Top OS Tab Bar -->
      <rect x="82" y="106" width="154" height="13" fill="#0F172A"/>
      <rect x="86" y="109" width="32" height="7" rx="2" fill="#1E293B"/>
      <rect x="90" y="111.5" width="22" height="2" rx="1" fill="#00F7F7"/>
      <rect x="122" y="109" width="32" height="7" rx="2" fill="#131D31"/>
      <rect x="126" y="111.5" width="20" height="2" rx="1" fill="#F59E0B"/>
      <rect x="158" y="109" width="32" height="7" rx="2" fill="#131D31"/>
      <rect x="162" y="111.5" width="22" height="2" rx="1" fill="#A78BFA"/>
      <line x1="165" y1="119" x2="165" y2="202" stroke="#1E293B" stroke-width="1"/>

      <!-- Left Pane: Scrolling Code Stream -->
      <g clip-path="url(#codeClip)">
        <g class="codeStream">
          <rect x="88" y="125" width="42" height="3.5" rx="1.5" fill="#00F7F7" opacity="0.9"/>
          <rect x="94" y="132" width="58" height="3.5" rx="1.5" fill="#38BDF8" opacity="0.7"/>
          <rect x="94" y="139" width="46" height="3.5" rx="1.5" fill="#F59E0B" opacity="0.8"/>
          <rect x="100" y="146" width="52" height="3.5" rx="1.5" fill="#94A3B8" opacity="0.55"/>
          <rect x="88" y="153" width="38" height="3.5" rx="1.5" fill="#34D399" opacity="0.85"/>
          <rect x="94" y="160" width="56" height="3.5" rx="1.5" fill="#A78BFA" opacity="0.75"/>
          <rect x="94" y="167" width="44" height="3.5" rx="1.5" fill="#38BDF8" opacity="0.7"/>
          <rect x="88" y="174" width="50" height="3.5" rx="1.5" fill="#F59E0B" opacity="0.75"/>
          <rect x="94" y="181" width="60" height="3.5" rx="1.5" fill="#00F7F7" opacity="0.8"/>
          <rect x="94" y="188" width="42" height="3.5" rx="1.5" fill="#34D399" opacity="0.7"/>
          <rect x="88" y="195" width="48" height="3.5" rx="1.5" fill="#94A3B8" opacity="0.6"/>
          <rect x="94" y="202" width="54" height="3.5" rx="1.5" fill="#38BDF8" opacity="0.75"/>
        </g>
      </g>

      <!-- Compile / ROS Build Progress Bar at Bottom Left -->
      <rect x="88" y="190" width="68" height="5" rx="2.5" fill="#1E293B"/>
      <rect class="progFill" x="88" y="190" width="68" height="5" rx="2.5" fill="url(#buildProg)"/>

      <!-- Right Pane Top: Animated ROS/Radar Telemetry Ring -->
      <g transform="translate(200, 146)">
        <circle cx="0" cy="0" r="19" fill="none" stroke="#1E293B" stroke-width="1.4"/>
        <circle cx="0" cy="0" r="12" fill="none" stroke="#00F7F7" stroke-width="1" stroke-dasharray="3 2.5" opacity="0.6"/>
        <g class="radarSweep">
          <path d="M0 0 L0 -18 A18 18 0 0 1 15.5 -9 Z" fill="#00F7F7" opacity="0.22"/>
          <line x1="0" y1="0" x2="0" y2="-18" stroke="#00F7F7" stroke-width="1.3"/>
        </g>
        <!-- Pulsing Mesh Nodes -->
        <circle class="nping" cx="-9" cy="-6" r="2.2" fill="#F59E0B"/>
        <circle class="nping2" cx="8" cy="7" r="2.2" fill="#34D399"/>
        <circle cx="0" cy="0" r="2.4" fill="#38BDF8"/>
      </g>

      <!-- Right Pane Bottom: Live Sliding CPU Sparkline -->
      <rect x="171" y="173" width="58" height="22" rx="4" fill="#0B1324" stroke="#1E293B" stroke-width="0.9"/>
      <g clip-path="url(#screenClip)">
        <path class="sparkSlide" d="M170 189 L177 184 L183 188 L190 179 L197 186 L204 180 L211 187 L218 178 L225 186 L232 181 L239 188 L246 180 L253 187" fill="none" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Subtle Monitor Scanline -->
      <rect class="scanline" x="82" y="106" width="154" height="5" fill="#00F7F7" opacity="0.16"/>
    </g>

    <!-- Monitor Stand -->
    <rect x="151" y="208" width="16" height="44" fill="#1E293B"/>
    <rect x="130" y="250" width="58" height="8" rx="4" fill="#334155"/>

    <!-- RGB Mechanical Keyboard -->
    <rect class="kbGlow" x="110" y="254" width="98" height="4" rx="2" fill="url(#rgbKb)"/>
    <rect x="108" y="250" width="102" height="6" rx="2.5" fill="#475569"/>

    <!-- Steaming Coffee Mug -->
    <g transform="translate(244, 228)">
      <path class="st1" d="M8 -2 C5 -8, 12 -13, 8 -19" fill="none" stroke="#FDBA74" stroke-width="1.8" stroke-linecap="round"/>
      <path class="st2" d="M15 -3 C19 -9, 12 -14, 16 -21" fill="none" stroke="#FDE68A" stroke-width="1.6" stroke-linecap="round"/>
      <path class="st3" d="M22 -2 C19 -8, 25 -12, 21 -18" fill="none" stroke="#FDBA74" stroke-width="1.4" stroke-linecap="round"/>
      <path d="M28 9 C35 9, 35 23, 28 23" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
      <rect x="3" y="4" width="25" height="28" rx="5" fill="#D97706" stroke="#FBBF24" stroke-width="1"/>
      <ellipse cx="15.5" cy="6" rx="10.5" ry="2.5" fill="#451A03"/>
    </g>

    <!-- Lo-fi Equalizer & Nerd Status under Desk -->
    <g transform="translate(34, 284)">
      <text x="0" y="10" fill="#64748B" font-family="Consolas, monospace" font-size="10">LO-FI · NERD_MODE: ON</text>
      <g transform="translate(142, 1)">
        <rect class="eq1" x="0" y="0" width="3.5" height="10" rx="1.5" fill="#F59E0B"/>
        <rect class="eq2" x="6.5" y="0" width="3.5" height="10" rx="1.5" fill="#FBBF24"/>
        <rect class="eq3" x="13" y="0" width="3.5" height="10" rx="1.5" fill="#38BDF8"/>
        <rect class="eq4" x="19.5" y="0" width="3.5" height="10" rx="1.5" fill="#00F7F7"/>
        <rect class="eq5" x="26" y="0" width="3.5" height="10" rx="1.5" fill="#34D399"/>
      </g>
    </g>
  </g>

  <!-- RIGHT PANEL: Terminal Identity Card -->
  <g transform="translate(316, 22)">
    <rect x="0" y="0" width="520" height="284" rx="14" fill="#090F1D" stroke="#1E293B" stroke-width="1.3"/>

    <!-- Window Title Bar -->
    <rect x="0" y="0" width="520" height="34" rx="14" fill="#0F172A"/>
    <rect x="0" y="20" width="520" height="14" fill="#0F172A"/>
    <line x1="0" y1="34" x2="520" y2="34" stroke="#1E293B" stroke-width="1"/>
    <circle cx="20" cy="17" r="5" fill="#FF5F56"/>
    <circle cx="36" cy="17" r="5" fill="#FFBD2E"/>
    <circle cx="52" cy="17" r="5" fill="#27C93F"/>
    <text x="70" y="21" fill="#94A3B8" font-family="Consolas, 'Fira Code', monospace" font-size="11.5">youssef@2099:~/midnight-lab</text>

    <!-- Status Pill -->
    <g transform="translate(324, 7)">
      <rect x="0" y="0" width="180" height="20" rx="10" fill="#0D2829" stroke="#134E4A" stroke-width="1"/>
      <circle class="pulse" cx="14" cy="10" r="3.5" fill="#34D399"/>
      <text x="25" y="13.5" fill="#6EE7B7" font-family="Consolas, monospace" font-size="9.5" font-weight="600">ONLINE · TECH ENTHUSIAST</text>
    </g>

    <!-- Hero Typography -->
    <text x="24" y="74" fill="#F8FAFC" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" letter-spacing="-0.4">Youssef Ashraf</text>
    <text x="24" y="98" fill="#38BDF8" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">Computer Nerd · Systems &amp; Software Engineer · Game Dev · Security</text>

    <!-- Terminal Lines -->
    <g transform="translate(24, 124)" font-family="Consolas, 'Fira Code', monospace" font-size="11.8">
      <text x="0" y="0" fill="#F59E0B">❯</text>
      <text x="16" y="0" fill="#64748B">mission :</text>
      <text x="86" y="0" fill="#E2E8F0">"If it computes, I want to build, break &amp; master it."</text>

      <text x="0" y="23" fill="#F59E0B">❯</text>
      <text x="16" y="23" fill="#64748B">worlds  :</text>
      <text x="86" y="23" fill="#00F7F7">ROS 2 &amp; Systems · Full-Stack · Unity/3D · Cyber · AI</text>

      <text x="0" y="46" fill="#F59E0B">❯</text>
      <text x="16" y="46" fill="#64748B">wins    :</text>
      <text x="86" y="46" fill="#CBD5E1">2x Mylo SWE · 21-Dev Lead · Data Orbit · DFKI/DAAD</text>

      <text x="0" y="69" fill="#F59E0B">❯</text>
      <text x="16" y="69" fill="#64748B">langs   :</text>
      <text x="86" y="69" fill="#FDE68A">English (Fluent) · Arabic (Native) · German (A2)</text>

      <text x="0" y="92" fill="#34D399">❯</text>
      <text x="16" y="92" fill="#94A3B8">while (curious) { tinker(); build(); secure(); ship(); }</text>
      <rect class="cur" x="394" y="81" width="7" height="13" rx="1.5" fill="#F59E0B"/>
    </g>

    <!-- Bottom Cozy Tags -->
    <g transform="translate(24, 242)" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600">
      <rect x="0" y="0" width="118" height="24" rx="7" fill="#172033" stroke="#293956"/>
      <text x="59" y="15.5" text-anchor="middle" fill="#FBBF24">🖥️ Computer Nerd</text>

      <rect x="126" y="0" width="122" height="24" rx="7" fill="#112432" stroke="#1E3A5F"/>
      <text x="187" y="15.5" text-anchor="middle" fill="#38BDF8">⚙️ Systems &amp; ROS 2</text>

      <rect x="256" y="0" width="102" height="24" rx="7" fill="#231B36" stroke="#3B2D5E"/>
      <text x="307" y="15.5" text-anchor="middle" fill="#C084FC">🎮 Game Dev</text>

      <rect x="366" y="0" width="108" height="24" rx="7" fill="#122826" stroke="#1A423E"/>
      <text x="420" y="15.5" text-anchor="middle" fill="#34D399">🛡️ Security &amp; AI</text>
    </g>
  </g>
</svg>