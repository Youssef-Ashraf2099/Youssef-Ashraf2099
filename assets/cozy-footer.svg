<svg xmlns="http://www.w3.org/2000/svg" width="860" height="108" viewBox="0 0 860 108" role="img" aria-label="Cozy Footer">
  <defs>
    <linearGradient id="footBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="footWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#00F7F7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes waveFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes mugSteam {
      0% { transform: translateY(0px); opacity: 0; }
      35% { opacity: 0.7; }
      100% { transform: translateY(-10px); opacity: 0; }
    }
    .wave { animation: waveFloat 4s ease-in-out infinite; }
    .ms1 { animation: mugSteam 2.8s ease-out infinite; }
    .ms2 { animation: mugSteam 3.2s ease-out infinite 0.9s; }
  </style>
  <rect x="1" y="1" width="858" height="106" rx="16" fill="url(#footBg)" stroke="#1E293B" stroke-width="1.5"/>
  <path class="wave" d="M2 84 Q 140 68, 280 84 T 560 84 T 858 84 L 858 106 L 2 106 Z" fill="url(#footWave)" opacity="0.22"/>
  <path d="M2 90 Q 215 76, 430 90 T 858 90" fill="none" stroke="url(#footWave)" stroke-width="1.5"/>

  <g transform="translate(46, 30)">
    <path class="ms1" d="M8 -2 C6 -6, 11 -9, 8 -13" fill="none" stroke="#FDBA74" stroke-width="1.6" stroke-linecap="round"/>
    <path class="ms2" d="M14 -2 C17 -6, 12 -9, 15 -14" fill="none" stroke="#FDE68A" stroke-width="1.4" stroke-linecap="round"/>
    <rect x="2" y="2" width="18" height="20" rx="4" fill="#D97706" stroke="#FBBF24" stroke-width="1"/>
    <path d="M20 6 C25 6, 25 16, 20 16" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <text x="86" y="44" fill="#F8FAFC" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, sans-serif" font-size="14.5" font-weight="700">Thanks for visiting my midnight lab — let's build something awesome</text>
  <text x="86" y="64" fill="#94A3B8" font-family="Consolas, 'Fira Code', monospace" font-size="11.2">Down to chat about systems, ROS 2, game dev, software engineering, security, or cool tech (EN · AR · DE).</text>
  <text x="828" y="54" text-anchor="end" fill="#64748B" font-family="Consolas, monospace" font-size="11">EOF // 2099</text>
</svg>